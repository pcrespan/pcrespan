name: Update profile assets

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate stats and contribution graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg assets/contributions.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh profile assets"
            git push
          fi
